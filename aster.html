<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aster — Главная</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/aster.css">
</head>
<body>

<!-- ШАПКА (как в watch.html, но без id у поиска — он пока не работает) -->
<header class="site-header">
    <div class="header-left">
        <button class="burger-btn" id="burgerBtn" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
        <a href="aster.html" class="logo">
            <img src="assets/aster-logo.png" alt="Aster" class="logo-img">
            <span class="logo-text">ASTER</span>
        </a>
    </div>

    <div class="search-box">
        <input type="text" placeholder="Поиск видео" autocomplete="off" disabled>
        <button class="search-btn" aria-label="Найти" disabled>
            <i class="fas fa-search"></i>
        </button>
    </div>

    <div class="header-right">
        <button class="icon-btn" aria-label="Уведомления">
            <i class="fas fa-bell"></i>
        </button>
        <div class="avatar-wrapper" id="avatarWrapper">
            <div class="avatar" id="avatarBtn">A</div>
            <button class="avatar-arrow" aria-label="Открыть меню">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
    </div>
</header>

<!-- ОСНОВНОЙ МАКЕТ -->
<div class="aster-layout">

    <!-- САЙДБАР -->
    <aside class="sidebar">

        <nav class="sidebar-nav">
            <a href="aster.html" class="nav-item active">
                <i class="fas fa-home"></i><span>Главная</span>
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <!-- Карточка пользователя (заполняется из localStorage) -->
        <div class="user-card" id="sidebarUserCard">
            <div class="user-avatar" id="sidebarUserAvatar">—</div>
            <div class="user-info">
                <div class="user-name" id="sidebarUserName">Пользователь</div>
                <div class="user-email" id="sidebarUserEmail">—</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="channel.html" class="nav-item"><i class="fas fa-tv"></i><span>Мой канал</span></a>
            <a href="#" class="nav-item"><i class="fas fa-history"></i><span>История</span></a>
            <a href="#" class="nav-item"><i class="fas fa-list-ul"></i><span>Плейлисты</span></a>
            <a href="#" class="nav-item"><i class="fas fa-users"></i><span>Подписки</span></a>
        </nav>

        <div class="sidebar-divider"></div>

        <button class="nav-item expand-btn" type="button">
            <i class="fas fa-chevron-up"></i><span>Развернуть</span>
        </button>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item"><i class="fas fa-film"></i><span>Фильмы</span></a>
            <a href="#" class="nav-item"><i class="fas fa-gamepad"></i><span>Игры</span></a>
        </nav>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-nav">
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Настройки</span></a>
            <a href="#" class="nav-item"><i class="fas fa-question-circle"></i><span>Помощь</span></a>
        </nav>

        <div class="copyright">© 2025 Aster</div>
    </aside>

    <!-- КОНТЕНТ -->
    <main class="main-content">

        <!-- Чипы-фильтры (пока не работают) -->
        <div class="chips-row">
            <button class="chip active" type="button">Все</button>
            <button class="chip" type="button">Новое</button>
            <button class="chip" type="button">Музыка</button>
            <button class="chip" type="button">Игры</button>
            <button class="chip" type="button">Обучение</button>
            <button class="chip" type="button">Подкасты</button>
            <button class="chip" type="button">Прямые эфиры</button>
            <button class="chip" type="button">Новости</button>
            <button class="chip" type="button">Спорт</button>
            <button class="chip" type="button">Технологии</button>
            <button class="chip" type="button">Кино</button>
            <button class="chip" type="button">Наука</button>
        </div>

        <div class="section-header">
            <h2>Рекомендации для вас</h2>
            <button class="setup-btn" type="button">
                <i class="fas fa-sliders-h"></i><span>Настроить</span>
            </button>
        </div>

        <!-- Сетка видео (рендерится в aster.js) -->
        <div class="video-grid" id="videoGrid"></div>

    </main>
</div>
<script src="js/demo-data.js"></script>
<script src="js/common.js"></script>
<script src="js/aster.js"></script>
</body>
</html>
